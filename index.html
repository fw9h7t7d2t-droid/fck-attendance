html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:radial-gradient(120% 140% at 0% 0%,#1f8a4c 0%,#177842 35%,#0c3d22 100%);border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(12,61,34,.25)}
.hrow{display:flex;align-items:center;gap:10px}
.crest{width:40px;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));flex:none}
.htxt{flex:1;line-height:1.15}
.htxt small{display:block;color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.22em}
.hrow h1{font-size:17px;margin:0;letter-spacing:.04em;font-weight:800}
.demo{font-size:10px;background:var(--gold);color:var(--gd);font-weight:800;border-radius:4px;padding:2px 5px;margin-left:6px;vertical-align:2px}
.coachbtn{background:transparent;border:1px solid rgba(194,180,90,.7);border-radius:16px;padding:5px 12px;font-size:12px;color:var(--goldl)}
.coachbtn.on{background:var(--gold);border-color:var(--gold);color:var(--gd);font-weight:800}
.me{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px}
.me{color:var(--goldl)}
.me select{flex:1;border:0;border-radius:10px;padding:9px 10px;background:#fff;color:var(--tx);font-size:15px;font-weight:600}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.tabbar .coachonly{display:none}
body.coach .tabbar .coachonly{display:flex}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{width:22px;height:22px}
.tabbar button{position:relative}
.tabbar button.on{color:var(--g);font-weight:800}
.tabbar button.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.sec{font-size:13px;color:var(--goldd);margin:16px 4px 8px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(12,61,34,.08);border:1px solid #edeee6}
.card.past{opacity:.75}
.evd{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--mut)}
.evd b{font-size:15px;color:var(--tx)}
.evt{font-size:16px;font-weight:700;margin:3px 0 1px}
.mut{color:var(--mut);font-size:12px}
.btn{display:block;width:100%;border:0;border-radius:10px;background:linear-gradient(180deg,#1d8a4d,#146a3a);color:#fff;font-weight:800;padding:11px;margin-top:10px;font-size:15px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--soft);color:var(--g);box-shadow:none}
.btn.red{background:#fbeae8;color:var(--red);box-shadow:none}
.btn.big{padding:14px;font-size:16px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.status{margin-top:10px;border-radius:10px;padding:9px 11px;font-size:14px}
.status.abs{background:#fdeaea;color:#8d1f1f}
.status.late{background:#fff3df;color:#7a4600}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;margin-right:4px}
.badge.abs{background:#fdeaea;color:var(--red)}
.badge.late{background:#fff3df;color:var(--org)}
.badge.ok{background:var(--soft);color:var(--g)}
.plist{margin-top:8px;border-top:1px solid var(--line)}
.prow{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:700;min-width:5.5em}
.prow .rs{flex:1;color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:1.8}
.empty::before{content:'';display:block;width:84px;height:90px;margin:0 auto 14px;background:var(--crest) center/contain no-repeat;opacity:.35}
.summary{position:relative;overflow:hidden;background:linear-gradient(135deg,#177842,#0c3d22);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--gold)}
.summary::after{content:'';position:absolute;right:-18px;top:-10px;width:110px;height:120px;background:var(--crest) center/contain no-repeat;opacity:.13}
.summary .big{font-size:28px;font-weight:900;color:var(--goldl)}
.summary .s{font-size:12px;opacity:.85}
.filters{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.filters button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;white-space:nowrap}
.filters button.on{background:var(--gd);color:var(--goldl);border-color:var(--gd)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:11px 4px;border-bottom:1px solid var(--line);text-align:right}
tr.pl{cursor:pointer}
tr.pl.open td{background:var(--soft)}
td.rem{font-weight:800;color:var(--red)}
td.rem.zero{color:var(--g)}
.hist td{padding:0;background:#fafcfb}
.hitem{display:flex;gap:8px;align-items:center;padding:9px 8px;border-bottom:1px dashed var(--line);font-size:13px;text-align:left}
.hitem .d{color:var(--mut);min-width:4.6em}
.hitem .t{flex:1}
.hitem .tog{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 9px;font-size:12px;white-space:nowrap}
.hitem .tog.done{background:var(--soft);color:var(--g);border-color:var(--soft)}
.hitem .tog.part{background:#fff3df;color:var(--org);border-color:#fff3df}
.pstat{padding:10px 8px 8px;font-size:14px;text-align:left}
.pstat b{color:var(--red)}
.hsub{font-size:11px;font-weight:700;color:var(--mut);padding:10px 8px 2px;text-align:left}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:4px}
.stepper button{width:52px;height:52px;border-radius:50%;border:0;background:var(--soft);color:var(--g);font-size:26px;font-weight:700}
.stepper .n{font-size:40px;font-weight:800;min-width:2.2em;text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;max-width:640px;margin:0 auto}
.sheet h3{margin:0 0 2px;font-size:17px}
.sheet label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 7px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:10px;font-weight:700;font-size:15px;color:var(--mut)}
.seg button.on.abs{background:var(--red);color:#fff}
.seg button.on.late{background:var(--org);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:14px}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.sheet textarea,.sheet input,.sheet select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:#fff}
.sheet textarea{min-height:70px;resize:vertical}
.preview{margin-top:14px;background:var(--bg);border-radius:10px;padding:11px;font-size:14px;text-align:center}
.preview b{font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1f1d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.rules{font-size:12px;color:var(--mut);line-height:1.7;margin-top:6px}
.seg button.on.g{background:var(--gd);color:var(--goldl)}
.psel{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:#fff;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tile{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tile span{display:block;font-size:11px;color:var(--mut)}
.tile b{font-size:24px}.tile small{font-size:12px;margin-left:2px;font-weight:600}
.tile .r{color:var(--red)}.tile .o{color:var(--org)}.tile .gg{color:var(--g)}
.ctitle{font-weight:700;margin-bottom:6px}
.legend{font-size:11px;color:var(--mut);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.brow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.brow .bl{width:7.5em;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bt{flex:1;height:14px;background:var(--bg);border-radius:4px;display:flex;overflow:hidden}
.brow .bv{width:5.2em;text-align:right;flex:none;font-weight:700}
.ba{background:var(--red)}.bla{background:#f2a33a}
.brow i{display:block;height:100%}
td.warn{color:var(--red);font-weight:700}
.tabbar button{font-size:10.5px}
.ctag{display:inline-block;font-size:11px;font-weight:800;background:var(--gd);color:var(--goldl);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.rcard label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rnum{display:flex;align-items:center;gap:14px}
.rnum button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);color:var(--g);font-size:22px;font-weight:700}
.rnum b{font-size:24px;min-width:3.4em;text-align:center}.rnum small{font-size:13px;margin-left:2px}
.copybox{width:100%;min-height:160px;margin-top:10px;font-size:13px}
</style>
</head>

<script>
/* ===== 設定：GASを公開したURLをここに貼る（空ならデモモード） ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyvj_buorbGWGh6kT9zZarr1NHE-7dNV5Qoj5KYLBkn0Hvrx16AnWyNrhE6LaZLrqJU/exec';
/* ================================================================ */

const DEMO = !API_URL;
const WD = '日月火水木金土';
let S = { players: [], events: [], reports: [], ranLog: [], rules: {}, reasons: [] };
const apply = j => { if (j.reports) apply(j); if (j.ranLog) S.ranLog = j.ranLog; };
let me = store('me') || '';
let coachPin = '';
let tab = 'report';
let period = 'all';
let openPlayer = null;
let form = null;
let statMode = 'team', statPlayer = '', statSort = 'abs';
let cat = '';
const catOf = p => (S.playerCats || {})[p] || '';
const hasCats = () => (S.categories || []).length > 0;
const evFor = (e, c) => !hasCats() || !c || (e.cats || []).includes(c);
const catPlayers = () => S.players.filter(p => !cat || catOf(p) === cat);
const catTag = e => hasCats() && e.cats && e.cats.length ? `<span class="ctag">${e.cats.length === S.categories.length ? '全体' : e.cats.map(esc).join('・')}</span>` : '';
function catBtns() {
  if (!hasCats()) return '';
  return `<div class="filters">${[['', '全カテゴリー'], ...S.categories.map(c => [c, c])].map(([k, l]) => `<button class="${cat === k ? 'on' : ''}" data-act="cat" data-v="${esc(k)}">${esc(l)}</button>`).join('')}</div>`;
}

/* ---------- 小物 ---------- */
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem('att_' + k);
    if (v === null) localStorage.removeItem('att_' + k); else localStorage.setItem('att_' + k, v);
  } catch (e) { return null; }
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDay = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const fmtTime = iso => { const d = new Date(iso); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
const evTime = e => e.allDay ? '終日' : `${fmtTime(e.start)}〜${fmtTime(e.end)}`;
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isPast = e => new Date(e.end) < today0();
const DEF_RULE = { distance: 300, absentRuns: 10, lateMinutesPerRun: 10, exemptReasons: [] };
const ruleOf = p => (S.rules || {})[catOf(p)] || (S.rules || {})['共通'] || Object.values(S.rules || {})[0] || DEF_RULE;
const distOf = p => ruleOf(p).distance;
const ruleText = r => `欠席 ${r.distance}m × ${r.absentRuns}本／遅刻 ${r.lateMinutesPerRun}分ごとに ${r.distance}m × 1本${(r.exemptReasons || []).length ? `<br>罰走なし：${r.exemptReasons.map(esc).join('、')}` : ''}`;
function calcRuns(type, late, reason, player) {
  const r = ruleOf(player);
  if ((r.exemptReasons || []).includes(reason)) return 0;
  return type === '欠席' ? r.absentRuns : Math.ceil((+late || 0) / r.lateMinutesPerRun);
}
const runText = (n, d) => n ? `${d}m × ${n}本` : '罰走なし';
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
// 「くわしく」は本人とコーチだけに見せる
const noteOk = r => !!r.note && (!!coachPin || r.player === me);
const repLine = r => r.type === '遅刻' ? `遅刻 ${r.late}分` : '欠席';

/* ---------- 通信 ---------- */
async function api(action, payload = {}) {
  if (DEMO) return demoApi(action, payload);
  let res;
  if (action === 'init') res = await fetch(`${API_URL}?action=init&player=${encodeURIComponent(me)}&pin=${encodeURIComponent(coachPin)}`);
  else res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}

async function load() {
  try {
    const j = await api('init');
    Object.assign(S, j);
    if (me && !S.players.includes(me)) me = '';
    cat = me ? catOf(me) : '';
    renderMe(); render();
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="empty">読み込めませんでした<br>${esc(e.message)}<br><button class="btn ghost" data-act="reload">もう一度</button></div>`;
  }
}

/* ---------- 画面 ---------- */
function renderMe() {
  const sel = document.getElementById('meSel');
  const opt = p => `<option ${p === me ? 'selected' : ''}>${esc(p)}</option>`;
  sel.innerHTML = `<option value="">選手を選ぶ</option>` + (hasCats()
    ? [...S.categories, ''].map(c => { const ps = S.players.filter(p => catOf(p) === c || (!c && !S.categories.includes(catOf(p)))); return ps.length ? `<optgroup label="${esc(c || 'カテゴリー未設定')}">${ps.map(opt).join('')}</optgroup>` : ''; }).join('')
    : S.players.map(opt).join(''));
  document.getElementById('demoTag').innerHTML = DEMO ? '<span class="demo">デモ</span>' : '';
  const cb = document.getElementById('coachBtn');
  cb.classList.toggle('on', !!coachPin); cb.textContent = coachPin ? 'コーチ中' : 'コーチ';
}

function render() {
  if (!coachPin && !['report', 'penalty', 'stats'].includes(tab)) tab = 'report';
  document.body.classList.toggle('coach', !!coachPin);
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const m = document.getElementById('main');
  m.innerHTML = tab === 'report' ? viewReport() : tab === 'events' ? viewEvents() : tab === 'penalty' ? viewPenalty() : tab === 'rules' ? viewRules() : viewStats();
}

function viewReport() {
  if (!me) return `<div class="empty">上の「選手を選ぶ」から<br>自分の名前を選んでください</div>`;
  const myCat = catOf(me);
  if (hasCats() && !S.categories.includes(myCat)) return `<div class="empty">${esc(me)} のカテゴリーが未設定です<br><span class="mut">スプレッドシートの「選手」シートB列にカテゴリーを入れてください</span></div>`;
  const evs = S.events.filter(e => !isPast(e) && evFor(e, myCat)).sort((a, b) => new Date(a.start) - new Date(b.start));
  if (!evs.length) return `<div class="empty">これからの予定はまだありません<br><span class="mut">チームのカレンダーに予定を入れると表示されます</span></div>`;
  const mine = Object.fromEntries(S.reports.filter(r => r.player === me).map(r => [r.key, r]));
  const st = playerStat(me);
  const my = `<div class="summary"><div class="s">${esc(me)} の罰走 残り</div><div class="big">${distOf(me)}m × ${st.remain}本</div><div class="s">${ruleText(ruleOf(me))}</div></div>`;
  return my + `<div class="sec">これからの予定${hasCats() ? `（${esc(myCat)}）` : ''}</div>` + evs.map(e => {
    const r = mine[e.key];
    return `<div class="card">
      <div class="evd"><b>${fmtDay(e.start)}</b><span>${evTime(e)}</span></div>
      <div class="evt">${esc(e.title)}${catTag(e)}</div>
      ${e.location ? `<div class="mut">📍 ${esc(e.location)}</div>` : ''}
      ${r ? `<div class="status ${r.type === '欠席' ? 'abs' : 'late'}"><b>${repLine(r)}</b>：${esc(r.reason)}${noteOk(r) ? `（${esc(r.note)}）` : ''}<br><span style="font-size:12px">${runText(r.runs, r.distance)}</span></div>
        <div class="row2"><button class="btn ghost" data-act="open" data-key="${esc(e.key)}">修正</button><button class="btn red" data-act="cancel" data-id="${esc(r.id)}">取り消す</button></div>`
        : `<button class="btn" data-act="open" data-key="${esc(e.key)}">欠席・遅刻を連絡</button>`}
    </div>`;
  }).join('');
}

function eventCard(e) {
  const rs = S.reports.filter(r => r.key === e.key).sort((a, b) => a.type.localeCompare(b.type));
  const abs = rs.filter(r => r.type === '欠席').length, late = rs.length - abs;
  return `<div class="card ${isPast(e) ? 'past' : ''}">
    <div class="evd"><b>${fmtDay(e.start)}</b><span>${evTime(e)}</span></div>
    <div class="evt">${esc(e.title)}${catTag(e)}</div>
    <div style="margin-top:6px"><span class="badge abs">欠席 ${abs}</span><span class="badge late">遅刻 ${late}</span><span class="badge ok">参加予定 ${Math.max(S.players.filter(p => evFor(e, catOf(p))).length - abs, 0)}</span></div>
    ${rs.length ? `<div class="plist">${rs.map(r => `<div class="prow"><span class="nm">${esc(r.player)}</span><span class="badge ${r.type === '欠席' ? 'abs' : 'late'}">${repLine(r)}</span><span class="rs">${esc(r.reason)}${noteOk(r) ? `・${esc(r.note)}` : ''}</span></div>`).join('')}</div>` : ''}
    ${coachPin ? `<button class="btn ghost" data-act="open" data-key="${esc(e.key)}" data-coach="1">＋ 記録を追加（コーチ）</button>` : ''}
  </div>`;
}

function viewEvents() {
  const up = S.events.filter(e => !isPast(e) && evFor(e, cat)).sort((a, b) => new Date(a.start) - new Date(b.start));
  const past = S.events.filter(e => isPast(e) && evFor(e, cat) && new Date(e.start) > Date.now() - 21 * 864e5).sort((a, b) => new Date(b.start) - new Date(a.start));
  if (!up.length && !past.length) return catBtns() + `<div class="empty">予定がありません</div>`;
  return catBtns() + (up.length ? `<div class="sec">これから</div>${up.map(eventCard).join('')}` : '') +
    (past.length ? `<div class="sec">終わった予定</div>${past.map(eventCard).join('')}` : '');
}

function inPeriod(r) {
  if (period === 'all') return true;
  const d = new Date(r.date), n = new Date();
  let y = n.getFullYear(), m = n.getMonth();
  if (period === 'last') { m--; if (m < 0) { m = 11; y--; } }
  return d.getFullYear() === y && d.getMonth() === m;
}

/* 走った本数は古い記録から順に充てる。残りは期間に関係なく全体で計算 */
function playerStat(p) {
  const all = S.reports.filter(r => r.player === p).sort((a, b) => new Date(a.date) - new Date(b.date));
  const logs = S.ranLog.filter(l => l.player === p).sort((a, b) => new Date(b.date) - new Date(a.date));
  const totalAll = all.reduce((s, r) => s + r.runs, 0);
  const ran = logs.reduce((s, l) => s + l.count, 0);
  let pool = ran;
  const paid = {};
  all.forEach(r => { const x = Math.min(pool, r.runs); paid[r.id] = x; pool -= x; });
  return { all, logs, totalAll, ran, remain: Math.max(totalAll - ran, 0), paid };
}
function penaltyRows() {
  return catPlayers().map(p => {
    const st = playerStat(p);
    const mine = st.all.filter(inPeriod);
    return { p, ...st, abs: mine.filter(r => r.type === '欠席').length, late: mine.filter(r => r.type === '遅刻').length, total: mine.reduce((s, r) => s + r.runs, 0), list: mine.slice().reverse() };
  }).sort((a, b) => b.remain - a.remain || b.total - a.total);
}
function paidLabel(r, paid) {
  const x = paid[r.id] || 0;
  if (!r.runs) return '';
  if (x >= r.runs) return `<span class="tog done">✓ 済み</span>`;
  if (x > 0) return `<span class="tog part">${x}/${r.runs}本</span>`;
  return `<span class="tog">未</span>`;
}

function viewPenalty() {
  const rows = penaltyRows();
  const remain = rows.reduce((s, r) => s + r.remain, 0);
  const km = (rows.reduce((s, r) => s + r.remain * distOf(r.p), 0) / 1000).toFixed(1);
  const ds = [...new Set(rows.map(r => distOf(r.p)))];
  return catBtns() + `<div class="summary"><div class="s">${cat ? esc(cat) : 'チーム全体'}の未消化</div><div class="big">${ds.length === 1 ? `${ds[0]}m × ` : ''}${remain}本</div><div class="s">合計 ${km}km</div></div>
  <div class="filters">${periodBtns()}</div>
  <div class="card" style="padding:6px 10px">
  <table><thead><tr><th>選手</th><th>欠席</th><th>遅刻</th><th>罰走</th><th>残り</th></tr></thead><tbody>
  ${rows.map(r => `<tr class="pl ${openPlayer === r.p ? 'open' : ''}" data-act="player" data-p="${esc(r.p)}"><td>${esc(r.p)}</td><td>${r.abs}</td><td>${r.late}</td><td>${r.total}本</td><td class="rem ${r.remain ? '' : 'zero'}">${r.remain}本</td></tr>
    ${openPlayer === r.p ? `<tr class="hist"><td colspan="5">
      <div class="pstat">罰走 ${r.totalAll}本 − 走った ${r.ran}本 ＝ <b>残り ${r.remain}本</b></div>
      ${coachPin && r.remain ? `<div style="padding:0 8px 8px"><button class="btn" data-act="runOpen" data-p="${esc(r.p)}">走った本数を記録</button></div>` : ''}
      <div class="hsub">欠席・遅刻の記録</div>
      ${r.list.length ? r.list.map(h => `<div class="hitem"><span class="d">${fmtDay(h.date)}</span><span class="t">${repLine(h)}・${esc(h.reason)}${noteOk(h) ? `<br><span class="mut">${esc(h.note)}</span>` : ''}<br><b>${runText(h.runs, h.distance)}</b></span>${paidLabel(h, r.paid)}</div>`).join('') : '<div class="hitem mut">この期間の記録なし</div>'}
      <div class="hsub">走った記録</div>
      ${r.logs.length ? r.logs.map(l => `<div class="hitem"><span class="d">${fmtDay(l.date)}</span><span class="t"><b>${distOf(l.player)}m × ${l.count}本</b>${l.memo ? `<br><span class="mut">${esc(l.memo)}</span>` : ''}</span>${coachPin ? `<button class="tog" data-act="runUndo" data-id="${esc(l.id)}">取り消す</button>` : ''}</div>`).join('') : '<div class="hitem mut">まだありません</div>'}
    </td></tr>` : ''}`).join('')}
  </tbody></table></div>
  <div class="rules">「罰走」は選んだ期間の本数、「残り」はこれまで全部の合計から走った本数を引いた数です。走った本数は古い記録から順に充てられます。</div>
  <button class="btn ghost" data-act="copy">罰走表をコピー（LINEに貼れる）</button>
  <div class="rules">${hasCats() ? (cat ? [cat] : S.categories).map(c => `<b>${esc(c)}</b>：${ruleText(S.rules[c] || DEF_RULE)}`).join('<br>') : 'ルール：' + ruleText(ruleOf(''))}</div>
  <div id="copyArea"></div>`;
}

/* ---------- 集計 ---------- */
const periodBtns = () => [['all', '全期間'], ['this', '今月'], ['last', '先月']].map(([k, l]) => `<button class="${period === k ? 'on' : ''}" data-act="period" data-p="${k}">${l}</button>`).join('');
function statsFor(p) {
  const evs = S.events.filter(e => isPast(e) && inPeriod({ date: e.start }) && evFor(e, catOf(p)));
  const keys = new Set(evs.map(e => e.key));
  const rs = S.reports.filter(r => r.player === p && keys.has(r.key)).sort((a, b) => new Date(b.date) - new Date(a.date));
  const abs = rs.filter(r => r.type === '欠席').length;
  const late = rs.filter(r => r.type === '遅刻');
  const lateMin = late.reduce((s, r) => s + r.late, 0);
  const n = evs.length;
  return { p, n, evs, rs, abs, late: late.length, lateMin, avgLate: late.length ? Math.round(lateMin / late.length) : 0, rate: n ? Math.round((n - abs) / n * 100) : null };
}
const rateTxt = r => r === null ? '—' : r + '%';
function bar(label, a, l, max, right) {
  const w = v => max ? (v / max * 100).toFixed(1) : 0;
  return `<div class="brow"><span class="bl">${label}</span><span class="bt"><i class="ba" style="width:${w(a)}%"></i><i class="bla" style="width:${w(l)}%"></i></span><span class="bv">${right}</span></div>`;
}
function viewStats() {
  const seg = `<div class="seg" style="margin-bottom:10px"><button class="${statMode === 'team' ? 'on g' : ''}" data-act="smode" data-v="team">チーム一覧</button><button class="${statMode === 'one' ? 'on g' : ''}" data-act="smode" data-v="one">個人</button></div>`;
  const head = seg + catBtns() + `<div class="filters">${periodBtns()}</div>`;
  if (statMode === 'team') {
    const rows = catPlayers().map(statsFor);
    const key = { abs: r => b => b.abs - r.abs, late: r => b => b.late - r.late, min: r => b => b.lateMin - r.lateMin, rate: r => b => (r.rate ?? 101) - (b.rate ?? 101) }[statSort];
    rows.sort((x, y) => key(y)(x) || y.late - x.late);
    const n = cat || !hasCats() ? (rows[0] ? rows[0].n : 0) : null;
    return head + `<div class="filters">${[['abs', '欠席が多い順'], ['late', '遅刻が多い順'], ['min', '遅刻時間が長い順'], ['rate', '出席率が低い順']].map(([k, l]) => `<button class="${statSort === k ? 'on' : ''}" data-act="ssort" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="card" style="padding:6px 10px"><table><thead><tr><th>選手</th><th>出席率</th><th>欠席</th><th>遅刻</th><th>遅刻計</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="pl" data-act="sopen" data-p="${esc(r.p)}"><td>${esc(r.p)}</td><td class="${r.rate !== null && r.rate < 80 ? 'warn' : ''}">${rateTxt(r.rate)}</td><td>${r.abs}回</td><td>${r.late}回</td><td>${r.lateMin}分</td></tr>`).join('')}
    </tbody></table></div><div class="rules">${n !== null ? `対象：終わった予定 ${n}回。` : '出席率は各選手のカテゴリーの予定で計算しています。'}名前をタップすると個人の詳しい集計が見られます。出席率80%未満は赤で表示。</div>`;
  }
  const plist = catPlayers();
  const p = plist.includes(statPlayer) ? statPlayer : (plist.includes(me) ? me : plist[0]);
  if (!p) return head + '<div class="empty">選手がいません</div>';
  const st = statsFor(p);
  // 理由別
  const reasons = S.reasons.map(rn => ({ rn, a: st.rs.filter(r => r.reason === rn && r.type === '欠席').length, l: st.rs.filter(r => r.reason === rn && r.type === '遅刻').length })).filter(x => x.a + x.l);
  const rmax = Math.max(1, ...reasons.map(x => x.a + x.l));
  // 月別
  const months = {};
  st.evs.forEach(e => { const d = new Date(e.start), k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; months[k] = months[k] || { n: 0, a: 0, l: 0 }; months[k].n++; });
  st.rs.forEach(r => { const d = new Date(r.date), k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; if (months[k]) months[k][r.type === '欠席' ? 'a' : 'l']++; });
  const mk = Object.keys(months).sort().reverse();
  const mmax = Math.max(1, ...mk.map(k => months[k].a + months[k].l));
  const ps = playerStat(p);
  return head + `<select class="psel" id="statSel">${plist.map(x => `<option ${x === p ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
  <div class="summary"><div class="s">${esc(p)}${hasCats() ? `（${esc(catOf(p))}）` : ''} の出席率</div><div class="big">${rateTxt(st.rate)}</div><div class="s">終わった予定 ${st.n}回中 ${st.n - st.abs}回参加</div></div>
  <div class="tiles">
    <div class="tile"><span>欠席</span><b class="r">${st.abs}<small>回</small></b></div>
    <div class="tile"><span>遅刻</span><b class="o">${st.late}<small>回</small></b></div>
    <div class="tile"><span>遅刻の合計</span><b>${st.lateMin}<small>分</small></b></div>
    <div class="tile"><span>1回の平均遅刻</span><b>${st.avgLate}<small>分</small></b></div>
    <div class="tile"><span>罰走 残り（全体）</span><b class="r">${ps.remain}<small>本</small></b></div>
    <div class="tile"><span>走った本数（全体）</span><b class="gg">${ps.ran}<small>本</small></b></div>
  </div>
  <div class="card"><div class="ctitle">理由別</div><div class="legend"><i class="ba"></i>欠席 <i class="bla"></i>遅刻</div>
    ${reasons.length ? reasons.map(x => bar(esc(x.rn), x.a, x.l, rmax, `${x.a + x.l}回`)).join('') : '<div class="mut">記録なし</div>'}</div>
  ${mk.length > 1 ? `<div class="card"><div class="ctitle">月別</div><div class="legend"><i class="ba"></i>欠席 <i class="bla"></i>遅刻</div>
    ${mk.map(k => { const m = months[k]; return bar(`${+k.slice(5)}月`, m.a, m.l, mmax, `${m.a}・${m.l}<span class="mut">/${m.n}回</span>`); }).join('')}</div>` : ''}
  <div class="card"><div class="ctitle">最近の記録</div>
    ${st.rs.length ? st.rs.slice(0, 15).map(r => `<div class="prow"><span class="nm" style="min-width:4.6em">${fmtDay(r.date)}</span><span class="badge ${r.type === '欠席' ? 'abs' : 'late'}">${repLine(r)}</span><span class="rs">${esc(r.reason)}${noteOk(r) ? `・${esc(r.note)}` : ''}</span></div>`).join('') : '<div class="mut">記録なし</div>'}</div>`;
}
document.addEventListener('change', e => { if (e.target.id === 'statSel') { statPlayer = e.target.value; render(); } });

/* ---------- ルール設定（コーチのみ） ---------- */
let ruleDraft = {};
function viewRules() {
  const names = hasCats() ? S.categories : Object.keys(S.rules);
  return `<div class="sec">カテゴリーごとの罰走ルール</div>` + names.map(c => {
    const r = ruleDraft[c] || (ruleDraft[c] = JSON.parse(JSON.stringify(S.rules[c] || DEF_RULE)));
    const changed = JSON.stringify(r) !== JSON.stringify(S.rules[c] || DEF_RULE);
    const num = (k, unit, step, list) => `<div class="rnum"><button data-act="rnum" data-c="${esc(c)}" data-k="${k}" data-v="-${step}">−</button><b>${r[k]}<small>${unit}</small></b><button data-act="rnum" data-c="${esc(c)}" data-k="${k}" data-v="${step}">＋</button></div>`;
    return `<div class="card rcard">
      <div class="rhead"><span class="ctag" style="margin:0">${esc(c)}</span>${changed ? '<span class="mut">未保存の変更あり</span>' : ''}</div>
      <label>1本の距離</label>${num('distance', 'm', 50)}
      <label>欠席1回の本数</label>${num('absentRuns', '本', 1)}

      <label>罰走なしにする理由</label>
      <div class="chips">${S.reasons.map(x => `<button class="${r.exemptReasons.includes(x) ? 'on' : ''}" data-act="rex" data-c="${esc(c)}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      <div class="preview" style="text-align:left">例：欠席 → <b>${r.distance}m × ${r.absentRuns}本</b>／30分遅刻 → <b>${r.distance}m × ${Math.ceil(30 / r.lateMinutesPerRun)}本</b></div>
      <button class="btn" data-act="rsave" data-c="${esc(c)}" ${changed ? '' : 'disabled style="opacity:.45"'}>${esc(c)} のルールを保存</button>

}

/* ---------- 入力シート ---------- */
function openSheet(key, coachAdd) {
  const ev = S.events.find(e => e.key === key);
  const who = coachAdd ? '' : me;
  const ex = S.reports.find(r => r.key === key && r.player === who);
  form = ex ? { key, player: who, type: ex.type, late: ex.late || 30, reason: ex.reason, note: ex.note || '', coachAdd }
            : { key, player: who, type: '欠席', late: 30, reason: '', note: '', coachAdd };
  form.ev = ev;
  renderSheet();
}

    <label>連絡の種類</label>
    <div class="seg"><button class="${form.type === '欠席' ? 'on abs' : ''}" data-act="ftype" data-v="欠席">欠席</button><button class="${form.type === '遅刻' ? 'on late' : ''}" data-act="ftype" data-v="遅刻">遅刻</button></div>
    ${form.type === '遅刻' ? `<label>遅れる時間</label><div class="chips">${[10, 15, 20, 30, 45, 60, 90].map(m => `<button class="${+form.late === m ? 'on' : ''}" data-act="flate" data-v="${m}">${m}分</button>`).join('')}</div>` : ''}
    <label>理由</label>
    <div class="chips">${S.reasons.map(r => `<button class="${form.reason === r ? 'on' : ''}" data-act="freason" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div>
    <label>くわしく（任意）</label>
    <textarea id="fNote" placeholder="例：38度の熱があるため／テスト前の補習">${esc(form.note)}</textarea>
    <div class="preview">${form.reason ? `罰走：<b>${runText(runs, distOf(form.player))}</b>` : '理由を選ぶと罰走が表示されます'}</div>
    <button class="btn big" data-act="submit">送信する</button>
  </div>`;
}
function syncForm() {
  const n = document.getElementById('fNote'); if (n) form.note = n.value;
  const p = document.getElementById('fPlayer'); if (p) form.player = p.value;
  const d = document.getElementById('rDate'); if (d) form.date = d.value;
  const m = document.getElementById('rMemo'); if (m) form.memo = m.value;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/* ---------- 操作 ---------- */
document.addEventListener('click', async ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb) { tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  try {
    if (a === 'reload') return load();
    if (a === 'open') return openSheet(b.dataset.key, !!b.dataset.coach);
    if (a === 'close') { form = null; return renderSheet(); }
    if (a === 'ftype') { syncForm(); form.type = b.dataset.v; return renderSheet(); }
    if (a === 'flate') { syncForm(); form.late = +b.dataset.v; return renderSheet(); }
    if (a === 'freason') { syncForm(); form.reason = b.dataset.v; return renderSheet(); }
    if (a === 'submit') {
      syncForm();
      if (!form.player) return toast('選手を選んでください');
      if (!form.reason) return toast('理由を選んでください');
      b.disabled = true; b.textContent = '送信中…';
      const j = await api('report', { key: form.key, player: form.player, type: form.type, late: form.type === '遅刻' ? form.late : 0, reason: form.reason, note: form.note, pin: coachPin });
      apply(j); form = null; renderSheet(); render(); toast('送信しました');
      return;
    }
    if (a === 'cancel') {
      const r = S.reports.find(x => x.id === b.dataset.id);
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'もう一度押すと取り消し'; return; }
      const j = await api('cancel', { id: r.id, player: r.player, pin: coachPin });
      apply(j); render(); toast('取り消しました'); return;
    }
    if (a === 'coach') {
      if (coachPin) { coachPin = ''; if (!DEMO) await load(); renderMe(); render(); return toast('コーチモードを終了しました'); }
      form = { pin: true }; return renderSheet();
    }
    if (a === 'pinOk') {
      const pin = document.getElementById('pinIn').value;
      await api('checkPin', { pin });
      coachPin = pin; form = null; renderSheet(); if (!DEMO) await load(); renderMe(); render(); toast('コーチモードに入りました'); return;
    }
    if (a === 'period') { period = b.dataset.p; openPlayer = null; return render(); }
    if (a === 'rnum') {
      const r = ruleDraft[b.dataset.c], k = b.dataset.k, lim = { distance: [50, 2000], absentRuns: [0, 50], lateMinutesPerRun: [5, 120] }[k];
      r[k] = Math.min(lim[1], Math.max(lim[0], r[k] + +b.dataset.v)); return render();
    }
    if (a === 'rex') { const r = ruleDraft[b.dataset.c], v = b.dataset.v; r.exemptReasons = r.exemptReasons.includes(v) ? r.exemptReasons.filter(x => x !== v) : [...r.exemptReasons, v]; return render(); }
    if (a === 'rsave') {
      const c = b.dataset.c;
      const j = await api('saveRules', { cat: c, rules: ruleDraft[c], pin: coachPin });
      S.rules = j.rules; delete ruleDraft[c]; render(); return toast(`${c} のルールを保存しました`);
    }
    if (a === 'cat') { cat = b.dataset.v; openPlayer = null; return render(); }
    if (a === 'smode') { statMode = b.dataset.v; return render(); }
    if (a === 'ssort') { statSort = b.dataset.v; return render(); }
    if (a === 'sopen') { statMode = 'one'; statPlayer = b.dataset.p; window.scrollTo(0, 0); return render(); }
    if (a === 'player') { openPlayer = openPlayer === b.dataset.p ? null : b.dataset.p; return render(); }
    if (a === 'runOpen') { form = { run: true, player: b.dataset.p, count: 1, date: ymd(new Date()), memo: '' }; return renderSheet(); }
    if (a === 'rstep') { syncForm(); form.count += +b.dataset.v; return renderSheet(); }
    if (a === 'rset') { syncForm(); form.count = +b.dataset.v; return renderSheet(); }
    if (a === 'runSubmit') {
      syncForm();
      if (!form.date) return toast('走った日を選んでください');
      b.disabled = true; b.textContent = '記録中…';
      const j = await api('run', { player: form.player, count: form.count, date: form.date, memo: form.memo, pin: coachPin });
      apply(j); const who = form.player, n = form.count; form = null; renderSheet(); render();
      return toast(`${who}：${n}本を記録しました`);
    }
    if (a === 'runUndo') {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'もう一度押す'; return; }
      const j = await api('runUndo', { id: b.dataset.id, pin: coachPin });
      apply(j); render(); return toast('取り消しました');
    }
    if (a === 'copy') {
      const label = { all: '全期間', this: '今月', last: '先月' }[period];
      const txt = `【罰走 残り本数${cat ? '・' + cat : ''}】\n` + penaltyRows().filter(r => r.remain).map(r => `${r.p}：残り${r.remain}本`).join('\n') + `\n（${label}の欠席・遅刻）\n` + penaltyRows().filter(r => r.abs || r.late).map(r => `${r.p}：欠席${r.abs}・遅刻${r.late}`).join('\n') + `\n※1本の距離：${[...new Set(penaltyRows().map(r => catOf(r.p)))].map(c => `${c ? c + ' ' : ''}${(S.rules[c] || ruleOf('')).distance}m`).join('・')}`;
      try { await navigator.clipboard.writeText(txt); toast('コピーしました'); }
      catch (e) { document.getElementById('copyArea').innerHTML = `<textarea class="copybox" readonly>${esc(txt)}</textarea><div class="mut">長押しで全選択してコピーしてください</div>`; }
      return;
    }
  } catch (e) {
    toast(e.message || 'エラーが発生しました');
    if (a === 'submit' || a === 'runSubmit') renderSheet();
  }
});
document.getElementById('meSel').addEventListener('change', e => { me = e.target.value; store('me', me || null); cat = me ? catOf(me) : ''; if (DEMO) render(); else load(); });

/* ---------- デモ用データ（API_URL が空のときだけ使う） ---------- */
function seedDemo() {
  const roster = {
    U13: ['井上 晴', '中村 奏', '西田 結翔', '松本 朝陽', '山口 壮真'],
    U14: ['青木 蒼', '石井 陽翔', '上田 湊', '遠藤 蓮', '岡本 大和', '加藤 悠真', '木村 颯', '小林 律', '佐藤 碧', '高橋 樹'],
    U15: ['田中 新', '中島 海翔', '橋本 大翔', '藤田 陸', '森 瑛太', '吉田 慧'],
  };
  const categories = Object.keys(roster);
  const players = categories.flatMap(c => roster[c]);
  const playerCats = Object.fromEntries(categories.flatMap(c => roster[c].map(p => [p, c])));
  const plan = { // 曜日: [名前, 開始h, 開始m, 終了h, 終了m, 場所]
    U13: { 1: ['練習', 17, 30, 19, 0, '市民グラウンド'], 3: ['練習', 17, 30, 19, 0, '市民グラウンド'], 6: ['練習', 13, 0, 16, 0, 'クラブグラウンド'] },
    U14: { 2: ['練習', 17, 30, 19, 30, '市民グラウンド'], 4: ['練習', 17, 30, 19, 30, '市民グラウンド'], 6: ['練習', 9, 0, 12, 0, 'クラブグラウンド'] },
    U15: { 2: ['練習', 19, 0, 21, 0, '市民グラウンド'], 5: ['練習', 19, 0, 21, 0, '市民グラウンド'], 0: ['リーグ戦', 9, 0, 15, 0, '市総合運動公園'] },
  };
  const events = [], t0 = today0();
  const add = (d, title, t, cats) => {
    const s = new Date(d); s.setHours(t[1], t[2]); const e = new Date(d); e.setHours(t[3], t[4]);
    events.push({ key: 'demo_' + s.getTime() + '_' + cats.join(''), title, start: s.toISOString(), end: e.toISOString(), allDay: false, location: t[5], cats });
  };
  for (let i = -150; i <= 21; i++) {
    const d = new Date(t0); d.setDate(d.getDate() + i); const w = d.getDay();
    categories.forEach(c => { const t = plan[c][w]; if (t) add(d, `${c} ${t[0]}`, t, [c]); });
    if (w === 0 && i % 2 === 0) add(d, 'U14 トレーニングマッチ', [0, 9, 0, 15, 0, '市総合運動公園'], ['U14']);
    if (w === 0 && i % 4 === 1) add(d, 'U13 リーグ戦', [0, 9, 0, 14, 0, '市総合運動公園'], ['U13']);
  }
  const nextSun = new Date(t0); nextSun.setDate(t0.getDate() + ((7 - t0.getDay()) % 7 || 7) + 7);
  add(nextSun, 'クラブ全体ミーティング', [0, 16, 0, 17, 0, 'クラブハウス'], categories.slice());
  const rules = {
    U13: { distance: 200, absentRuns: 5, lateMinutesPerRun: 15, exemptReasons: ['体調不良・けが'] },
    U14: { distance: 300, absentRuns: 10, lateMinutesPerRun: 10, exemptReasons: [] },
    U15: { distance: 400, absentRuns: 10, lateMinutesPerRun: 10, exemptReasons: [] },
  };
  const reasons = ['体調不良・けが', '学校行事', '家の用事', '寝坊', '交通機関の遅れ', 'その他'];
  S = { players, playerCats, categories, events, reports: [], ranLog: [], rules, reasons };
  // 決まった乱数で、選手ごとに休みやすさ・遅れやすさを変えたサンプルを作る
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const pAbs = {}, pLate = {};
  players.forEach(p => { pAbs[p] = .01 + rnd() * .11; pLate[p] = .01 + rnd() * .13; });
  const absR = [['体調不良・けが', '発熱'], ['体調不良・けが', '足首のけが'], ['学校行事', '運動会'], ['家の用事', '法事'], ['その他', '']];
  const lateR = [['寝坊', ''], ['学校行事', '委員会'], ['交通機関の遅れ', 'バス遅延'], ['家の用事', '']];
  let n = 0;
  events.filter(isPast).forEach(e => players.filter(pl => e.cats.includes(playerCats[pl])).forEach(pl => {
    const x = rnd();
    if (x < pAbs[pl]) { const [r, note] = absR[Math.floor(rnd() * absR.length)]; S.reports.push({ id: 'r' + n++, ts: e.start, key: e.key, date: e.start, title: e.title, player: pl, type: '欠席', late: 0, reason: r, note, runs: calcRuns('欠席', 0, r, pl), distance: distOf(pl) }); }
    else if (x < pAbs[pl] + pLate[pl]) { const late = [10, 15, 20, 30, 45][Math.floor(rnd() * 5)]; const [r, note] = lateR[Math.floor(rnd() * lateR.length)]; S.reports.push({ id: 'r' + n++, ts: e.start, key: e.key, date: e.start, title: e.title, player: pl, type: '遅刻', late, reason: r, note, runs: calcRuns('遅刻', late, r, pl), distance: distOf(pl) }); }
  }));
  const up14 = events.filter(e => !isPast(e) && e.cats.includes('U14')).sort((a, b) => new Date(a.start) - new Date(b.start));
  if (up14[0]) S.reports.push({ id: 'r90', ts: new Date().toISOString(), key: up14[0].key, date: up14[0].start, title: up14[0].title, player: '遠藤 蓮', type: '欠席', late: 0, reason: '学校行事', note: '修学旅行', runs: calcRuns('欠席', 0, '学校行事', '遠藤 蓮'), distance: 300 });
  // 走った記録：選手ごとに罰走の6〜9割を消化済みにしておく
  const past = events.filter(isPast);
  players.forEach((pl, pi) => {
    let left = Math.floor(S.reports.filter(r => r.player === pl).reduce((s, r) => s + r.runs, 0) * (0.6 + rnd() * 0.3));
    let k = 0;
    while (left > 0) { const c = Math.min(left, [5, 10, 3][k % 3]); const ev = past[Math.min(past.length - 1, 5 + k * 9 + pi)]; S.ranLog.push({ id: `l${pi}_${k}`, date: ev.start, player: pl, count: c, memo: '' }); left -= c; k++; }
  });
}
function demoSave() { store('demo5', JSON.stringify({ reports: S.reports, ranLog: S.ranLog })); }
function demoApi(action, p) {
  const clone = o => JSON.parse(JSON.stringify(o));
  if (action === 'init') {
    seedDemo();
    try { const sv = JSON.parse(store('demo5') || 'null'); if (sv) { S.reports = sv.reports.filter(r => S.events.some(e => e.key === r.key)); S.ranLog = sv.ranLog; } const rl = JSON.parse(store('demoRules') || 'null'); if (rl) S.rules = rl; } catch (e) {}
    return clone(S);
  }
  if (action === 'checkPin') { if (p.pin !== '1234') throw new Error('暗証番号が違います'); return { ok: true }; }
  if (action === 'report') {
    const e = S.events.find(x => x.key === p.key);
    S.reports = S.reports.filter(r => !(r.key === p.key && r.player === p.player));
    S.reports.push({ id: 'r' + Date.now(), ts: new Date().toISOString(), key: p.key, date: e.start, title: e.title, player: p.player, type: p.type, late: p.late, reason: p.reason, note: p.note, runs: calcRuns(p.type, p.late, p.reason, p.player), distance: distOf(p.player) });
  }
  if (action === 'cancel') S.reports = S.reports.filter(r => r.id !== p.id);
  if (action === 'run') {
    if (p.pin !== '1234') throw new Error('コーチモードに入ってください');
    if (p.count < 1 || p.count > playerStat(p.player).remain) throw new Error('残りの本数を超えています');
    S.ranLog.push({ id: 'l' + Date.now(), date: new Date(p.date + 'T12:00:00').toISOString(), player: p.player, count: p.count, memo: p.memo });
  }
  if (action === 'saveRules') { if (p.pin !== '1234') throw new Error('コーチモードに入ってください'); S.rules[p.cat] = p.rules; store('demoRules', JSON.stringify(S.rules)); return { ok: true, rules: clone(S.rules) }; }
  if (action === 'runUndo') { if (p.pin !== '1234') throw new Error('コーチモードに入ってください'); S.ranLog = S.ranLog.filter(l => l.id !== p.id); }
  demoSave();
  return { ok: true, reports: clone(S.reports), ranLog: clone(S.ranLog) };
}

if (!DEMO && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
load();
